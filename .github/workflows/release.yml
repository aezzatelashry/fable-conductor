name: release

# Two ways to cut a release, both from the version in SKILL.md:
#   - push a tag vX.Y.Z (it must equal that version), or
#   - press "Run workflow" on main: the tag is created by the release itself.
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Validate skill
        run: python tools/validate.py
      - name: Privacy check
        run: python tools/privacy_check.py
      - name: Tests
        run: python -m pytest -q

  release:
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Version, and the tag it must equal
        id: version
        run: |
          version=$(sed -n 's/^  version: "\(.*\)"$/\1/p' skills/fable-conductor/SKILL.md | head -n 1)
          if [ -z "$version" ]; then
            echo "no metadata.version in SKILL.md" >&2
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            tag="${GITHUB_REF_NAME#v}"
            if [ "$tag" != "$version" ]; then
              echo "tag $tag does not match metadata.version $version" >&2
              exit 1
            fi
          elif [ "$GITHUB_REF_NAME" != "main" ]; then
            echo "a manual release runs from main only, not $GITHUB_REF_NAME" >&2
            exit 1
          fi
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Build archive
        run: python tools/package.py skills/fable-conductor fable-conductor.skill
      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists; bump the version in SKILL.md first" >&2
            exit 1
          fi
          gh release create "$TAG" fable-conductor.skill --target "$GITHUB_SHA" --generate-notes
