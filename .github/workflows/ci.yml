name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: python -m pip install ruff pytest
      - name: Lint
        run: ruff check .
      - name: Format
        run: ruff format --check .
      - name: Validate skill
        run: python tools/validate.py
      - name: Privacy check
        run: python tools/privacy_check.py
      - name: Tests
        run: python -m pytest -q
